[mod-name]
title=Planet Backdrops Scale

[mod-description]
description=Adds automatic size and rotation speed scaling to planet backdrops based on their gravity

[mod-setting-name]
vp-scale-min=Minimum planet scale
vp-scale-max=Maximum planet scale
vp-scale-nauvis-size=Size of Nauvis
vp-scale-enable-rotation-multiplier=Day/Night Cycle rotation speed adjustment

[mod-setting-description]
vp-scale-nauvis-size=The size of the planet Nauvis. This is used as a reference for scaling other planets based on their gravity. Increase this value if you want to make planets appear bigger or closer to the spaceships.
vp-scale-min=The minimum scale multiplier relative to Nauvis for a planet with very little gravity.
vp-scale-max=The maximum scale multiplier relative to Nauvis for a planet with very high gravity.
vp-scale-enable-rotation-multiplier=Enable rotation speed adjustment based on the planet's day/night cycle duration relative to Nauvis' day/night cycle. Shorter day/night cycles result in faster rotation speeds, longer cycles result in slower rotation speeds.
